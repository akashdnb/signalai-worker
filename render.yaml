services:
  - type: worker
    name: signalai-python-worker
    runtime: python
    plan: starter
    buildCommand: pip install .
    startCommand: python -m signalai_worker.worker
    envVars:
      - key: SIGNALAI_DATABASE_URL
        sync: false
      - key: SIGNALAI_MAX_JOBS
        value: "10"
      - key: SIGNALAI_POLL_INTERVAL_SECONDS
        value: "1"
      - key: SIGNALAI_LEASE_SECONDS
        value: "900"
      - key: SIGNALAI_RETRY_BACKOFF_SECONDS
        value: "10"
      - key: SIGNALAI_MAX_ATTEMPTS
        value: "5"
